# ── Ansyra local / self-hosted stack ───────────────────────────────────────
# One command to run everything: `docker compose up --build`
# Set the environment variables below (or use an `.env` file next to this).

services:
  ansyra:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      APP_MODE: ${APP_MODE:-demo}
      PORT: 3000
      SITE_URL: ${SITE_URL:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      PROXY_IP_HEADER: ${PROXY_IP_HEADER:-x-forwarded-for}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      CANONICAL_HOST_REDIRECT: ${CANONICAL_HOST_REDIRECT:-true}
      ALLOW_CROSS_SITE_EMBEDDING: ${ALLOW_CROSS_SITE_EMBEDDING:-false}
      AI_DATA_PROCESSING_APPROVED: ${AI_DATA_PROCESSING_APPROVED:-false}
      CRON_SECRET: ${CRON_SECRET:-}

      # Supabase — from https://supabase.com/dashboard/project/_/settings/api
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # Postgres — Supabase → Project Settings → Database → Connection String
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_SSL: ${DATABASE_SSL:-true}

      # AI — one provider and its key; see api/lib/ai.ts
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SENTRY_DSN: ${SENTRY_DSN:-}

    restart: unless-stopped
